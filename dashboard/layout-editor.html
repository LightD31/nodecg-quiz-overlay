<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Editor</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            margin: 0;
            padding: 10px;
            background: #1a1a2e;
            color: #eee;
        }
        .section {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        h3 {
            margin: 0 0 15px 0;
            color: #00d9ff;
            font-size: 14px;
            text-transform: uppercase;
        }
        .preview-wrapper {
            overflow-x: auto;
            margin-bottom: 15px;
        }
        .preview-container {
            position: relative;
            width: 320px;
            height: 180px;
            background: #0f0f23;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .draggable {
            position: absolute;
            cursor: move;
            padding: 6px 10px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
            user-select: none;
            border: 2px solid transparent;
            white-space: nowrap;
        }
        .draggable:hover, .draggable.active {
            border-color: #00d9ff;
            z-index: 100;
        }
        .draggable.team1 {
            background: rgba(0, 217, 255, 0.4);
            color: #00d9ff;
        }
        .draggable.team2 {
            background: rgba(255, 107, 107, 0.4);
            color: #ff6b6b;
        }
        .draggable.question {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 200px;
            text-align: center;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
            margin-right: 8px;
        }
        .btn-warning {
            background: #ffa502;
            color: #000;
        }
        .btn-warning:hover {
            background: #cc8400;
        }
        .info {
            font-size: 11px;
            color: #666;
            margin-bottom: 10px;
        }
        .resolution {
            font-size: 10px;
            color: #00d9ff;
            margin-bottom: 10px;
        }
        .coord-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .coord-group {
            background: #0f0f23;
            padding: 10px;
            border-radius: 4px;
        }
        .coord-group label {
            display: block;
            font-size: 10px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .coord-group .title {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .coord-group.team1 .title { color: #00d9ff; }
        .coord-group.team2 .title { color: #ff6b6b; }
        .coord-group.question .title { color: #fff; }
        .coord-row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        .coord-row input {
            width: 60px;
            padding: 4px 6px;
            border: 1px solid #333;
            border-radius: 3px;
            background: #1a1a2e;
            color: #fff;
            font-size: 11px;
            text-align: center;
        }
        .coord-row span {
            font-size: 10px;
            color: #666;
            line-height: 24px;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            background: #0f0f23;
            border-radius: 4px;
        }
        .toggle-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00d9ff;
            cursor: pointer;
        }
        .toggle-row label {
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
        }
        .toggle-row .hint {
            font-size: 10px;
            color: #666;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="section">
        <h3>Stream Overlay Layout</h3>
        <div class="resolution">Resolution: 1920 × 1080</div>
        <div class="info">Drag elements or enter pixel coordinates below</div>
        
        <div class="preview-wrapper">
            <div class="preview-container" id="previewContainer">
                <div class="draggable team1" id="dragTeam1">Team 1</div>
                <div class="draggable team2" id="dragTeam2">Team 2</div>
                <div class="draggable question" id="dragQuestion">Question & Answers</div>
            </div>
        </div>
        
        <div class="coord-inputs">
            <div class="coord-group team1">
                <div class="title">Team 1</div>
                <div class="coord-row">
                    <span>X:</span>
                    <input type="number" id="team1X" min="0" max="1920" step="1">
                    <span>px</span>
                </div>
                <div class="coord-row">
                    <span>Y:</span>
                    <input type="number" id="team1Y" min="0" max="1080" step="1">
                    <span>px</span>
                </div>
            </div>
            <div class="coord-group team2">
                <div class="title">Team 2</div>
                <div class="coord-row">
                    <span>X:</span>
                    <input type="number" id="team2X" min="0" max="1920" step="1">
                    <span>px</span>
                </div>
                <div class="coord-row">
                    <span>Y:</span>
                    <input type="number" id="team2Y" min="0" max="1080" step="1">
                    <span>px</span>
                </div>
            </div>
            <div class="coord-group question">
                <div class="title">Question</div>
                <div class="coord-row">
                    <span>X:</span>
                    <input type="number" id="questionX" min="0" max="1920" step="1">
                    <span>px</span>
                </div>
                <div class="coord-row">
                    <span>Y:</span>
                    <input type="number" id="questionY" min="0" max="1080" step="1">
                    <span>px</span>
                </div>
            </div>
        </div>
        
        <div class="toggle-row">
            <input type="checkbox" id="symmetryToggle">
            <label for="symmetryToggle">Symmetrical Scores</label>
            <span class="hint">Mirror X position, same Y</span>
        </div>
        
        <div style="margin-top: 15px;">
            <button id="resetLayout" class="btn btn-warning">Reset to Default</button>
        </div>
    </div>

    <script>
        const CANVAS_WIDTH = 1920;
        const CANVAS_HEIGHT = 1080;
        const PREVIEW_WIDTH = 320;
        const PREVIEW_HEIGHT = 180;
        const SCALE = PREVIEW_WIDTH / CANVAS_WIDTH;

        const layoutRep = nodecg.Replicant('overlayLayout', {
            defaultValue: {
                team1: { x: 250, y: 100 },
                team2: { x: 1670, y: 100 },
                question: { x: 960, y: 600 }
            }
        });

        const previewContainer = document.getElementById('previewContainer');
        const draggables = {
            team1: document.getElementById('dragTeam1'),
            team2: document.getElementById('dragTeam2'),
            question: document.getElementById('dragQuestion')
        };
        const inputs = {
            team1: { x: document.getElementById('team1X'), y: document.getElementById('team1Y') },
            team2: { x: document.getElementById('team2X'), y: document.getElementById('team2Y') },
            question: { x: document.getElementById('questionX'), y: document.getElementById('questionY') }
        };

        let activeDraggable = null;
        let offsetX = 0;
        let offsetY = 0;
        
        const symmetryToggle = document.getElementById('symmetryToggle');
        
        function applySymmetry(sourceTeam, x, y) {
            if (!symmetryToggle.checked) return;
            
            const targetTeam = sourceTeam === 'team1' ? 'team2' : 'team1';
            // For center-anchored elements, mirror around the canvas center (960)
            // Element at x=100 should mirror to x=1820 (960 + (960-100) = 1820)
            const centerX = CANVAS_WIDTH / 2;
            const distanceFromCenter = centerX - x;
            const mirroredX = centerX + distanceFromCenter;
            
            if (layoutRep.value) {
                layoutRep.value[targetTeam] = { x: mirroredX, y: y };
            }
        }

        function pixelToPreview(px) {
            return px * SCALE;
        }

        function previewToPixel(preview) {
            return Math.round(preview / SCALE);
        }

        function updatePositions(layout) {
            if (!layout) return;
            
            Object.keys(draggables).forEach(key => {
                const el = draggables[key];
                const pos = layout[key];
                if (pos) {
                    const previewX = pixelToPreview(pos.x);
                    const previewY = pixelToPreview(pos.y);
                    
                    el.style.left = `${previewX}px`;
                    el.style.top = `${previewY}px`;
                    
                    if (key === 'question') {
                        el.style.transform = 'translateX(-50%)';
                    } else {
                        el.style.transform = 'translate(-50%, -50%)';
                    }
                    
                    inputs[key].x.value = pos.x;
                    inputs[key].y.value = pos.y;
                }
            });
        }

        layoutRep.on('change', (newVal) => {
            updatePositions(newVal);
        });

        // Input change handlers
        Object.keys(inputs).forEach(key => {
            inputs[key].x.addEventListener('change', () => {
                if (layoutRep.value) {
                    const newX = parseInt(inputs[key].x.value) || 0;
                    layoutRep.value[key].x = newX;
                    if (key === 'team1' || key === 'team2') {
                        applySymmetry(key, newX, layoutRep.value[key].y);
                    }
                }
            });
            inputs[key].y.addEventListener('change', () => {
                if (layoutRep.value) {
                    const newY = parseInt(inputs[key].y.value) || 0;
                    layoutRep.value[key].y = newY;
                    if (key === 'team1' || key === 'team2') {
                        applySymmetry(key, layoutRep.value[key].x, newY);
                    }
                }
            });
        });

        // Drag functionality
        Object.keys(draggables).forEach(key => {
            const el = draggables[key];
            
            el.addEventListener('mousedown', (e) => {
                activeDraggable = key;
                el.classList.add('active');
                const rect = el.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                
                if (key === 'question') {
                    offsetX = rect.width / 2;
                } else {
                    // Team elements use center anchor
                    offsetX = rect.width / 2;
                    offsetY = rect.height / 2;
                }
                
                e.preventDefault();
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (!activeDraggable) return;
            
            const containerRect = previewContainer.getBoundingClientRect();
            const el = draggables[activeDraggable];
            
            let previewX, previewY;
            
            if (activeDraggable === 'question') {
                // Question uses center X anchor only
                previewX = e.clientX - containerRect.left;
                previewY = e.clientY - containerRect.top - offsetY;
            } else {
                // Team elements use center anchor for both X and Y
                previewX = e.clientX - containerRect.left;
                previewY = e.clientY - containerRect.top;
            }
            
            // Clamp to preview bounds
            previewX = Math.max(0, Math.min(PREVIEW_WIDTH, previewX));
            previewY = Math.max(0, Math.min(PREVIEW_HEIGHT, previewY));
            
            el.style.left = `${previewX}px`;
            el.style.top = `${previewY}px`;
            
            // Update inputs with pixel values
            const pixelX = previewToPixel(previewX);
            const pixelY = previewToPixel(previewY);
            inputs[activeDraggable].x.value = pixelX;
            inputs[activeDraggable].y.value = pixelY;
        });

        document.addEventListener('mouseup', () => {
            if (!activeDraggable) return;
            
            const el = draggables[activeDraggable];
            el.classList.remove('active');
            
            // Save to replicant
            if (layoutRep.value) {
                const pixelX = parseInt(inputs[activeDraggable].x.value) || 0;
                const pixelY = parseInt(inputs[activeDraggable].y.value) || 0;
                layoutRep.value[activeDraggable] = { x: pixelX, y: pixelY };
                
                // Apply symmetry for team elements
                if (activeDraggable === 'team1' || activeDraggable === 'team2') {
                    applySymmetry(activeDraggable, pixelX, pixelY);
                }
            }
            
            activeDraggable = null;
        });

        document.getElementById('resetLayout').addEventListener('click', () => {
            layoutRep.value = {
                team1: { x: 250, y: 100 },
                team2: { x: 1670, y: 100 },
                question: { x: 960, y: 600 }
            };
        });
    </script>
</body>
</html>
