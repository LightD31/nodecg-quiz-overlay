<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #1a1a2e;
            transition: background-color 0.3s ease;
        }
        

        .overlay-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        /* Scoreboard */
        .team-score {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            z-index: 10;
            transition: left 0.3s ease, top 0.3s ease;
            transform: translate(-50%, -50%);
        }
        
        .team-score.team-1 {
            border: 3px solid var(--team1-color, #00d9ff);
        }
        
        .team-score.team-2 {
            border: 3px solid var(--team2-color, #ff6b6b);
        }
        
        .team-name {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .team-points {
            font-size: 36px;
            font-weight: 700;
            min-width: 60px;
            text-align: center;
        }
        
        .team-1 .team-points {
            color: var(--team1-color, #00d9ff);
        }
        
        .team-2 .team-points {
            color: var(--team2-color, #ff6b6b);
        }
        
        /* Question Card */
        .question-container {
            position: absolute;
            left: 960px;
            top: 810px;
            transform: translateX(-50%);
            width: 1600px;
            opacity: 0;
            transition: opacity 0.5s ease, left 0.3s ease, top 0.3s ease;
        }
        
        .question-container.visible {
            opacity: 1;
        }
        
        .question-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 25px 30px;
            padding-top: 35px;
            backdrop-filter: blur(20px);
            border: 3px solid rgba(0, 217, 255, 0.4);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.5),
                inset 0 0 60px rgba(0, 217, 255, 0.05);
            height: 410px;
            overflow: visible;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .question-text {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .propositions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .propositions-grid.true-false {
            grid-template-columns: 1fr 1fr;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* Three Words Clue Layout */
        .clues-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            transition: all 0.3s ease;
        }
        
        .clue-word {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.2) 0%, rgba(0, 136, 255, 0.2) 100%);
            border: 3px solid #00d9ff;
            border-radius: 20px;
            padding: 35px 50px;
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            box-shadow: 0 10px 40px rgba(0, 217, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .clue-separator {
            font-size: 52px;
            color: #00d9ff;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        /* Funny Summary Layout */
        .summary-container {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .summary-text {
            font-size: 38px;
            font-weight: 500;
            color: #fff;
            font-style: italic;
            line-height: 1.5;
            padding: 35px 50px;
            background: linear-gradient(135deg, rgba(255, 165, 2, 0.15) 0%, rgba(255, 107, 107, 0.15) 100%);
            border: 2px solid rgba(255, 165, 2, 0.4);
            border-radius: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        
        /* Answer Display (for phases 2 & 3) */
        .answer-container {
            text-align: center;
            margin-top: 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            flex-shrink: 0;
            max-height: 0;
            overflow: hidden;
        }
        
        .answer-container.visible {
            margin-top: 15px;
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
        }
        
        .answer-label {
            font-size: 18px;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }
        
        .answer-text {
            font-size: 36px;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            animation: pulse 1s ease-in-out infinite;
        }
        
        /* Phase Badge */
        .phase-badge {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffa502 0%, #ff6b35 100%);
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(255, 165, 2, 0.4);
        }
        
        .question-card {
            position: relative;
        }

        .proposition.hidden {
            display: none;
        }
        
        /* Wrong answer feedback for open questions */
        .wrong-feedback-container {
            text-align: center;
            margin-top: 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            flex-shrink: 0;
            max-height: 0;
            overflow: hidden;
        }
        
        .wrong-feedback-container.visible {
            margin-top: 15px;
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
        }
        
        .wrong-feedback {
            display: inline-block;
            background: rgba(255, 68, 68, 0.2);
            border: 2px solid #ff4444;
            border-radius: 12px;
            padding: 10px 30px;
            animation: shake 0.6s ease-in-out;
        }
        
        .wrong-feedback-team {
            font-size: 16px;
            color: #ff6b6b;
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .wrong-feedback-text {
            font-size: 22px;
            font-weight: 700;
            color: #ff4444;
        }
        
        .proposition {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }
        
        .proposition.correct {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        
        .proposition.correct .prop-letter {
            background: #00ff88;
            color: #000;
        }
        
        .proposition.wrong {
            background: rgba(255, 68, 68, 0.3);
            border-color: #ff4444;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.4);
        }
        
        .proposition.wrong .prop-letter {
            background: #ff4444;
            color: #fff;
        }
        
        .proposition.eliminated {
            opacity: 0.35;
            background: rgba(100, 100, 100, 0.2);
            border-color: rgba(100, 100, 100, 0.4);
        }
        
        .proposition.eliminated .prop-letter {
            background: rgba(100, 100, 100, 0.5);
            color: #888;
            border-color: #666;
        }
        
        .proposition.eliminated .prop-text {
            color: #888;
            text-decoration: line-through;
        }
        
        .prop-letter {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 217, 255, 0.2);
            border: 2px solid #00d9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #00d9ff;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .prop-text {
            font-size: 22px;
            color: #fff;
            font-weight: 500;
            transition: font-size 0.3s ease;
        }
        
        /* Dynamic sizing when answer is visible */
        .question-card.answer-visible .question-text {
            font-size: 26px;
            margin-bottom: 15px;
        }
        
        .question-card.answer-visible .clues-container {
            gap: 25px;
            flex: 0 0 auto;
        }
        
        .question-card.answer-visible .clue-word {
            padding: 20px 35px;
            font-size: 32px;
        }
        
        .question-card.answer-visible .clue-separator {
            font-size: 36px;
        }
        
        .question-card.answer-visible .summary-container {
            flex: 0 0 auto;
        }
        
        .question-card.answer-visible .summary-text {
            font-size: 26px;
            padding: 20px 35px;
            line-height: 1.4;
        }

        /* Styles for placeholder logo */
        #placeholderLogoContainer {
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #placeholderLogo {
            max-width: 80%;
            max-height: 300px;
            object-fit: contain;
        }

        /* When in logo mode, hide all direct children of question-card except the logo */
        .question-card.logo-mode > *:not(#placeholderLogoContainer) {
            display: none !important;
        }
        .question-card.logo-mode #placeholderLogoContainer {
            display: flex;
        }
        
        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .proposition.correct {
            animation: pulse 1s ease-in-out infinite;
        }
        
        .proposition.wrong {
            animation: shake 0.6s ease-in-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .question-container.visible {
            animation: slideUp 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <!-- Team 1 Score -->
        <div class="team-score team-1" id="team1Container">
            <span class="team-name" id="team1Name">Team 1</span>
            <span class="team-points" id="team1Score">0</span>
        </div>
        
        <!-- Team 2 Score -->
        <div class="team-score team-2" id="team2Container">
            <span class="team-name" id="team2Name">Team 2</span>
            <span class="team-points" id="team2Score">0</span>
        </div>
        
        <!-- Question Card -->
        <div class="question-container" id="questionContainer">
            <div class="question-card">
                <!-- Placeholder Logo -->
                <div id="placeholderLogoContainer">
                    <img id="placeholderLogo" src="">
                </div>

                <div class="phase-badge" id="phaseBadge">Phase 1</div>
                <div class="question-text" id="questionText">Question goes here?</div>
                
                <!-- Multiple Choice / True-False propositions -->
                <div class="propositions-grid" id="propositionsGrid">
                    <div class="proposition" id="prop0">
                        <span class="prop-letter">A</span>
                        <span class="prop-text" id="propText0">Answer A</span>
                    </div>
                    <div class="proposition" id="prop1">
                        <span class="prop-letter">B</span>
                        <span class="prop-text" id="propText1">Answer B</span>
                    </div>
                    <div class="proposition" id="prop2">
                        <span class="prop-letter">C</span>
                        <span class="prop-text" id="propText2">Answer C</span>
                    </div>
                    <div class="proposition" id="prop3">
                        <span class="prop-letter">D</span>
                        <span class="prop-text" id="propText3">Answer D</span>
                    </div>
                </div>
                
                <!-- Three Words Clue (Phase 2) -->
                <div class="clues-container" id="cluesContainer" style="display: none;">
                    <div class="clue-word" id="clue0">Mot 1</div>
                    <span class="clue-separator">•</span>
                    <div class="clue-word" id="clue1">Mot 2</div>
                    <span class="clue-separator">•</span>
                    <div class="clue-word" id="clue2">Mot 3</div>
                </div>
                
                <!-- Funny Summary (Phase 3) -->
                <div class="summary-container" id="summaryContainer" style="display: none;">
                    <div class="summary-text" id="summaryText">"Un résumé foireux..."</div>
                </div>
                
                <!-- Answer Display (for phases 2 & 3) -->
                <div class="answer-container" id="answerContainer">
                    <div class="answer-label">Réponse</div>
                    <div class="answer-text" id="answerText">Le Film</div>
                </div>
                
                <!-- Wrong Answer Feedback (for phases 2 & 3) -->
                <div class="wrong-feedback-container" id="wrongFeedbackContainer">
                    <div class="wrong-feedback">
                        <div class="wrong-feedback-team" id="wrongFeedbackTeam">Team 1</div>
                        <div class="wrong-feedback-text">✗ Mauvaise réponse</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questionRep = nodecg.Replicant('question');
        const scoresRep = nodecg.Replicant('scores');
        const logoUrlRep = nodecg.Replicant('logoUrl');
        const backgroundColorRep = nodecg.Replicant('backgroundColor', { defaultValue: '#1a1a2e' });
        const layoutRep = nodecg.Replicant('overlayLayout', {
            defaultValue: {
                team1: { x: 3, y: 3 },
                team2: { x: 80, y: 3 },
                question: { x: 50, y: 75 }
            }
        });
        
        const questionContainer = document.getElementById('questionContainer');
        const questionCard = document.querySelector('.question-card');
        const questionText = document.getElementById('questionText');
        const team1Container = document.getElementById('team1Container');
        const team2Container = document.getElementById('team2Container');
        const propositionsGrid = document.getElementById('propositionsGrid');
        const cluesContainer = document.getElementById('cluesContainer');
        const summaryContainer = document.getElementById('summaryContainer');
        const answerContainer = document.getElementById('answerContainer');
        const answerText = document.getElementById('answerText');
        const summaryText = document.getElementById('summaryText');
        const phaseBadge = document.getElementById('phaseBadge');
        const wrongFeedbackContainer = document.getElementById('wrongFeedbackContainer');
        const wrongFeedbackTeam = document.getElementById('wrongFeedbackTeam');
        const placeholderLogo = document.getElementById('placeholderLogo');
        
        const clueElements = [
            document.getElementById('clue0'),
            document.getElementById('clue1'),
            document.getElementById('clue2')
        ];
        
        const propTexts = [
            document.getElementById('propText0'),
            document.getElementById('propText1'),
            document.getElementById('propText2'),
            document.getElementById('propText3')
        ];
        const propElements = [
            document.getElementById('prop0'),
            document.getElementById('prop1'),
            document.getElementById('prop2'),
            document.getElementById('prop3')
        ];
        const propLetters = ['A', 'B', 'C', 'D'];
        
        const team1Name = document.getElementById('team1Name');
        const team2Name = document.getElementById('team2Name');
        const team1Score = document.getElementById('team1Score');
        const team2Score = document.getElementById('team2Score');
        
        let wrongAnimationTimeout = null;
        
        // Phase labels
        const phaseLabels = {
            1: 'Phase 1 - QCM',
            2: 'Phase 2 - 3 Mots',
            3: 'Phase 3 - Résume foireux'
        };

        backgroundColorRep.on('change', (newVal) => {
            document.body.style.backgroundColor = newVal;
        });

        function updateVisibility() {
            const question = questionRep.value;
            const logoUrl = logoUrlRep.value;

            if (!question) return;

            const isHidden = question.state === 'hidden';

            if (isHidden && logoUrl) {
                questionContainer.classList.add('visible');
                questionCard.classList.add('logo-mode');
                placeholderLogo.src = logoUrl;
            } else if (isHidden && !logoUrl) {
                questionContainer.classList.remove('visible');
                questionCard.classList.remove('logo-mode');
            } else {
                questionContainer.classList.add('visible');
                questionCard.classList.remove('logo-mode');
            }
        }
        
        questionRep.on('change', (newVal) => {
            if (!newVal) return;

            updateVisibility();
            
            const questionType = newVal.type || 'multipleChoice';
            const phase = newVal.phase || 1;
            const isMultipleChoice = questionType === 'multipleChoice' || questionType === 'trueFalse';
            const isThreeWords = questionType === 'threeWordsClue';
            const isFunnySummary = questionType === 'funnySummary';
            
            // Update phase badge
            phaseBadge.textContent = phaseLabels[phase] || `Phase ${phase}`;
            
            // Show/hide appropriate containers based on question type
            propositionsGrid.style.display = isMultipleChoice ? 'grid' : 'none';
            cluesContainer.style.display = isThreeWords ? 'flex' : 'none';
            summaryContainer.style.display = isFunnySummary ? 'block' : 'none';
            
            // Show answer container only for phases 2 & 3 when revealed
            if ((isThreeWords || isFunnySummary) && newVal.state === 'revealed') {
                answerContainer.classList.add('visible');
                questionCard.classList.add('answer-visible');
                answerText.textContent = newVal.answer || 'Réponse';
                wrongFeedbackContainer.classList.remove('visible');
            } else {
                answerContainer.classList.remove('visible');
                questionCard.classList.remove('answer-visible');
            }
            
            // Show wrong feedback for open questions when a team answered wrong (and not revealed)
            if ((isThreeWords || isFunnySummary) && newVal.openWrongTeam && newVal.state === 'showing') {
                // Get team name from scores replicant
                const teamKey = newVal.openWrongTeam;
                let teamName = teamKey === 'team1' ? 'Équipe 1' : 'Équipe 2';
                if (scoresRep.value && scoresRep.value[teamKey]) {
                    teamName = scoresRep.value[teamKey].name || teamName;
                }
                wrongFeedbackTeam.textContent = teamName;
                wrongFeedbackContainer.classList.add('visible');
            } else {
                wrongFeedbackContainer.classList.remove('visible');
            }
            
            // Update question text
            questionText.textContent = newVal.text || 'Question goes here?';
            
            // Handle Three Words Clue
            if (isThreeWords && newVal.clues) {
                newVal.clues.forEach((clue, i) => {
                    if (clueElements[i]) {
                        clueElements[i].textContent = clue;
                    }
                });
            }
            
            // Handle Funny Summary
            if (isFunnySummary && newVal.summary) {
                summaryText.textContent = `"${newVal.summary}"`;
            }
            
            // Handle Multiple Choice / True-False
            if (isMultipleChoice) {
                const isTrueFalse = questionType === 'trueFalse';
                const propCount = isTrueFalse ? 2 : 4;
                
                // Update grid layout for True/False
                if (isTrueFalse) {
                    propositionsGrid.classList.add('true-false');
                } else {
                    propositionsGrid.classList.remove('true-false');
                }
                
                // Update propositions
                if (newVal.propositions) {
                    newVal.propositions.forEach((prop, i) => {
                        if (i < propCount) {
                            propTexts[i].textContent = prop || `Answer ${propLetters[i]}`;
                            propElements[i].classList.remove('hidden');
                        }
                    });
                }
                
                // Hide unused propositions for True/False questions
                for (let i = propCount; i < 4; i++) {
                    propElements[i].classList.add('hidden');
                }
                
                // Handle correct answer reveal and wrong answer feedback
                for (let i = 0; i < propCount; i++) {
                    const el = propElements[i];
                    const isLastWrong = newVal.lastWrongAnswer === i;
                    const isEliminated = newVal.eliminatedAnswers && newVal.eliminatedAnswers.includes(i);
                    
                    if (isLastWrong && newVal.state === 'showing') {
                        el.classList.remove('correct', 'eliminated');
                        el.classList.add('wrong');
                        
                        if (!newVal.showCorrectOnWrong) {
                            if (wrongAnimationTimeout) clearTimeout(wrongAnimationTimeout);
                            wrongAnimationTimeout = setTimeout(() => {
                                el.classList.remove('wrong');
                                el.classList.add('eliminated');
                            }, 800);
                        }
                    } else {
                        el.classList.remove('correct', 'wrong', 'eliminated');
                        
                        if (newVal.state === 'showing' && isEliminated && !isLastWrong) {
                            el.classList.add('eliminated');
                        }
                        
                        if (newVal.state === 'showing' && newVal.showCorrectOnWrong && i === newVal.correctAnswer) {
                            el.classList.add('correct');
                        }
                        
                        if (newVal.state === 'revealed') {
                            if (i === newVal.correctAnswer) {
                                el.classList.add('correct');
                            }
                            if (isEliminated) {
                                el.classList.add('eliminated');
                            }
                        }
                    }
                }
            }
        });

        logoUrlRep.on('change', updateVisibility);
        
        scoresRep.on('change', (newVal) => {
            if (!newVal) return;
            
            team1Name.textContent = newVal.team1.name || 'Team 1';
            team2Name.textContent = newVal.team2.name || 'Team 2';
            team1Score.textContent = newVal.team1.score || 0;
            team2Score.textContent = newVal.team2.score || 0;
            
            // Apply dynamic team colors
            const team1Color = newVal.team1.color || '#00d9ff';
            const team2Color = newVal.team2.color || '#ff6b6b';
            document.documentElement.style.setProperty('--team1-color', team1Color);
            document.documentElement.style.setProperty('--team2-color', team2Color);
        });
        

        layoutRep.on('change', (newVal) => {
            if (!newVal) return;
            
            // Position Team 1
            if (newVal.team1) {
                team1Container.style.left = `${newVal.team1.x}px`;
                team1Container.style.top = `${newVal.team1.y}px`;
            }
            
            // Position Team 2
            if (newVal.team2) {
                team2Container.style.left = `${newVal.team2.x}px`;
                team2Container.style.top = `${newVal.team2.y}px`;
            }
            
            // Position Question
            if (newVal.question) {
                questionContainer.style.left = `${newVal.question.x}px`;
                questionContainer.style.top = `${newVal.question.y}px`;
            }
        });
    </script>
</body>
</html>
