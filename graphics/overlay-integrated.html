<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Overlay Integrated (Global Theme)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --theme-bg: #1a1a2e;
            --theme-surface: rgba(255, 255, 255, 0.08);
            --theme-surface-2: rgba(255, 255, 255, 0.05);
            --theme-text: rgba(255, 255, 255, 0.92);
            --theme-text-strong: #ffffff;
            --theme-muted: rgba(255, 255, 255, 0.55);

            --theme-accent: #7a0000;
            --theme-accent-rgb: 122, 0, 0;
            --theme-accent-soft: rgba(122, 0, 0, 0.14);
            --theme-border: rgba(122, 0, 0, 0.55);
            --theme-border-soft: rgba(122, 0, 0, 0.28);

            --theme-success: #00ff88;
            --theme-success-rgb: 0, 255, 136;
            --theme-danger: #ff4444;
            --theme-danger-rgb: 255, 68, 68;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: linear-gradient(135deg, #224aa8, #b56fdc);
            transition: background 0.3s ease;
        }
        
        .overlay-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        /* Integrated Header */
        .integrated-header {
            position: absolute;
            top: -52px;
            left: 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            justify-items: center;
            align-items: center;
            z-index: 20;
            width: 100%;
            pointer-events: none;
        }

        .phase-badge {
            background: rgba(var(--theme-accent-rgb), 0.92);
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid rgba(var(--theme-accent-rgb), 0.40);
            background-clip: padding-box;
            box-shadow: none;
            filter: drop-shadow(0 5px 20px rgba(var(--theme-accent-rgb), 0.35));
            white-space: nowrap;
            position: relative;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .phase-badge.hidden {
            opacity: 0;
        }

        .score-pill {
            background: var(--theme-surface);
            backdrop-filter: blur(10px);
            padding: 10px 50px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            height: 100px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            border: 2px solid var(--theme-border-soft);
        }

        .score-pill.team-1 {
            background: rgba(var(--team1-color-rgb, 0, 217, 255), 0.80);
            box-shadow: 0 5px 20px var(--team1-shadow, rgba(0, 217, 255, 0.5));
            border-color: rgba(var(--team1-color-rgb, 0, 217, 255), 0.95);
        }

        .score-pill.team-2 {
            background: rgba(var(--team2-color-rgb, 255, 107, 107), 0.35);
            box-shadow: 0 5px 20px var(--team2-shadow, rgba(255, 107, 107, 0.3));
            border-color: rgba(var(--team2-color-rgb, 255, 107, 107), 0.75);
        }

        .score-pill .team-name {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .score-pill .team-points {
            font-size: 72px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            min-width: 80px;
            text-align: center;
        }
        
        /* Question Card */
        .question-container {
            position: absolute;
            left: 960px;
            top: 600px;
            transform: translateX(-50%);
            width: 1600px;
            opacity: 0;
            transition: opacity 0.5s ease, left 0.3s ease, top 0.3s ease;
        }
        
        .question-container.visible {
            opacity: 1;
            animation: slideUp 0.5s ease-out;
        }
        
        .question-card {
            background: var(--theme-surface);
            border-radius: 30px;
            padding: 25px 30px;
            padding-top: 40px;
            backdrop-filter: blur(20px);
            border: 3px solid var(--theme-border);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.35),
                inset 0 0 60px var(--theme-accent-soft);
            height: 410px;
            overflow: visible;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            transition: opacity 0.5s ease;
        }
        
        .question-text {
            font-size: 42px;
            font-weight: 600;
            color: var(--theme-text-strong);
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.3;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .propositions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .propositions-grid.true-false {
            grid-template-columns: 1fr 1fr;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .propositions-grid.special-mode {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            width: 100%;
            grid-template-columns: none;
        }
        
        .propositions-grid.special-mode .proposition {
            flex: 1;
            justify-content: center;
        }

        /* Three Words Clue Layout */
        .clues-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
        }
        
        .clue-word {
            background: linear-gradient(135deg, rgba(var(--theme-accent-rgb), 0.20) 0%, rgba(var(--theme-accent-rgb), 0.20) 100%);
            border: 3px solid var(--theme-accent);
            border-radius: 20px;
            padding: 15px 30px;
            font-size: 36px;
            font-weight: 700;
            color: var(--theme-text-strong);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            box-shadow: 0 10px 40px rgba(var(--theme-accent-rgb), 0.30);
            transition: all 0.3s ease;
        }
        
        .clue-separator {
            font-size: 36px;
            color: var(--theme-accent);
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        /* Funny Summary Layout */
        .summary-container {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .summary-text {
            font-size: 46px;
            font-weight: 500;
            color: var(--theme-text-strong);
            font-style: italic;
            line-height: 1.5;
            padding: 35px 50px;
            background: linear-gradient(135deg, rgba(var(--theme-accent-rgb), 0.15) 0%, rgba(var(--theme-accent-rgb), 0.15) 100%);
            border: 2px solid var(--theme-border-soft);
            border-radius: 20px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            transition: all 0.3s ease;
        }
        
        /* Answer Display */
        .answer-container {
            text-align: center;
            margin-top: 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            flex-shrink: 0;
            max-height: 0;
            overflow: hidden;
        }
        
        .answer-container.visible {
            margin-top: 15px;
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
        }
        
        .answer-label {
            font-size: 24px;
            color: var(--theme-success);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }
        
        .answer-text {
            font-size: 48px;
            font-weight: 700;
            color: var(--theme-success);
            text-shadow: 0 0 30px rgba(var(--theme-success-rgb), 0.45);
            animation: pulse 1s ease-in-out infinite;
        }
        
        .proposition.hidden {
            display: none;
        }
        
        /* Wrong answer feedback */
        .wrong-feedback-container {
            text-align: center;
            margin-top: 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            flex-shrink: 0;
            max-height: 0;
            overflow: hidden;
        }
        
        .wrong-feedback-container.visible {
            margin-top: 15px;
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
        }
        
        .wrong-feedback {
            display: inline-block;
            background: rgba(var(--theme-danger-rgb), 0.18);
            border: 2px solid var(--theme-danger);
            border-radius: 12px;
            padding: 10px 30px;
            animation: shake 0.6s ease-in-out;
        }
        
        .wrong-feedback-team {
            font-size: 20px;
            color: var(--theme-danger);
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .wrong-feedback-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--theme-danger);
        }
        
        .proposition {
            background: var(--theme-surface-2);
            border: 2px solid var(--theme-border-soft);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }
        
        .proposition.correct {
            background: rgba(var(--theme-success-rgb), 0.18);
            border-color: var(--theme-success);
            box-shadow: 0 0 30px rgba(var(--theme-success-rgb), 0.28);
            animation: pulse 1s ease-in-out infinite;
        }
        
        .proposition.correct .prop-letter {
            background: var(--theme-success);
            color: #000;
        }
        
        .proposition.wrong {
            background: rgba(var(--theme-danger-rgb), 0.26);
            border-color: var(--theme-danger);
            box-shadow: 0 0 30px rgba(var(--theme-danger-rgb), 0.30);
            animation: shake 0.6s ease-in-out;
        }
        
        .proposition.wrong .prop-letter {
            background: var(--theme-danger);
            color: #fff;
        }
        
        .proposition.eliminated {
            opacity: 0.35;
            background: rgba(100, 100, 100, 0.2);
            border-color: rgba(100, 100, 100, 0.4);
        }
        
        .proposition.eliminated .prop-letter {
            background: rgba(100, 100, 100, 0.5);
            color: var(--theme-muted);
            border-color: #666;
        }
        
        .proposition.eliminated .prop-text {
            color: var(--theme-muted);
            text-decoration: line-through;
        }
        
        .prop-letter {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(var(--theme-accent-rgb), 0.20);
            border: 2px solid var(--theme-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--theme-accent);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .prop-text {
            font-size: 30px;
            color: var(--theme-text);
            font-weight: 500;
            transition: font-size 0.3s ease;
        }
        
        /* Dynamic sizing when answer is visible */
        .question-card.answer-visible .question-text {
            font-size: 32px;
            margin-bottom: 15px;
        }
        
        .question-card.answer-visible .clues-container {
            gap: 25px;
            flex: 0 0 auto;
        }
        
        .question-card.answer-visible .clue-word {
            padding: 20px 35px;
            font-size: 40px;
        }
        
        .question-card.answer-visible .clue-separator {
            font-size: 44px;
        }
        
        .question-card.answer-visible .summary-container {
            flex: 0 0 auto;
        }
        
        .question-card.answer-visible .summary-text {
            font-size: 34px;
            padding: 20px 35px;
            line-height: 1.4;
        }

        /* Styles for placeholder logo */
        #placeholderLogoContainer {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #placeholderLogo {
            max-width: 80%;
            max-height: 300px;
            object-fit: contain;
        }

        .question-card.logo-mode > *:not(#placeholderLogoContainer) {
            display: none !important;
        }
        .question-card.logo-mode #placeholderLogoContainer {
            display: flex;
        }
        
        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .question-card.hidden-content {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <!-- Question Card -->
        <div class="question-container" id="questionContainer">
            <!-- Integrated Header with Scores and Phase -->
            <div class="integrated-header">
                <div class="score-pill team-1">

                <div class="phase-badge" id="phaseBadge">Phase 1</div>

            <div class="question-card">

                <div class="clues-container" id="cluesContainer" style="display: none;">

                </div>
                
                <!-- Funny Summary (Phase 3) -->
                <div class="summary-container" id="summaryContainer" style="display: none;">
                    <div class="summary-text" id="summaryText">"Un résumé foireux..."</div>
                </div>
                
                <!-- Propositions Grid (Used for all types) -->
                <div class="propositions-grid" id="propositionsGrid">
                    <div class="proposition" id="prop0">
                        <span class="prop-letter">A</span>

                    </div>
                    <div class="proposition" id="prop1">
                        <span class="prop-letter">B</span>
                        <span class="prop-text" id="propText1">Answer B</span>
                    </div>
                    <div class="proposition" id="prop2">
                        <span class="prop-letter">C</span>
                        <span class="prop-text" id="propText2">Answer C</span>
                    </div>

                        <span class="prop-letter">D</span>
                        <span class="prop-text" id="propText3">Answer D</span>
                    </div>
                </div>
                
                <!-- Answer Display (for phases 2 & 3) -->
                <div class="answer-container" id="answerContainer">
                    <div class="answer-label">Réponse</div>
                    <div class="answer-text" id="answerText">Le Film</div>
                </div>
                
                <!-- Wrong Answer Feedback (for phases 2 & 3) -->
                <div class="wrong-feedback-container" id="wrongFeedbackContainer">
                    <div class="wrong-feedback">
                        <div class="wrong-feedback-team" id="wrongFeedbackTeam">Team 1</div>
                        <div class="wrong-feedback-text">✗ Mauvaise réponse</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questionRep = nodecg.Replicant('question');
        const scoresRep = nodecg.Replicant('scores');
        const logoUrlRep = nodecg.Replicant('logoUrl');
        const gradientColor1Rep = nodecg.Replicant('gradientColor1', { defaultValue: '#224aa8' });
        const gradientColor2Rep = nodecg.Replicant('gradientColor2', { defaultValue: '#b56fdc' });
        const layoutRep = nodecg.Replicant('overlayLayout', {
            defaultValue: {
                team1: { x: 250, y: 100 },
                team2: { x: 1670, y: 100 },
                question: { x: 960, y: 600 }
            }
        });
        
        const questionContainer = document.getElementById('questionContainer');
        const questionCard = document.querySelector('.question-card');
        const questionText = document.getElementById('questionText');
        const propositionsGrid = document.getElementById('propositionsGrid');
        const cluesContainer = document.getElementById('cluesContainer');
        const summaryContainer = document.getElementById('summaryContainer');
        const answerContainer = document.getElementById('answerContainer');
        const answerText = document.getElementById('answerText');
        const summaryText = document.getElementById('summaryText');
        const phaseBadge = document.getElementById('phaseBadge');
        const wrongFeedbackContainer = document.getElementById('wrongFeedbackContainer');
        const wrongFeedbackTeam = document.getElementById('wrongFeedbackTeam');
        const placeholderLogo = document.getElementById('placeholderLogo');
        
        const clueElements = [
            document.getElementById('clue0'),
            document.getElementById('clue1'),
            document.getElementById('clue2')
        ];
        
        const propTexts = [
            document.getElementById('propText0'),
            document.getElementById('propText1'),
            document.getElementById('propText2'),
            document.getElementById('propText3')
        ];
        const propElements = [
            document.getElementById('prop0'),
            document.getElementById('prop1'),
            document.getElementById('prop2'),
            document.getElementById('prop3')
        ];
        const propLetters = ['A', 'B', 'C', 'D'];
        
        const team1Name = document.getElementById('team1Name');
        const team2Name = document.getElementById('team2Name');
        const team1Score = document.getElementById('team1Score');
        const team2Score = document.getElementById('team2Score');
        
        let wrongAnimationTimeout = null;

        function hexToRgb(hex) {
            if (!hex) return null;
            const cleaned = hex.replace('#', '');
            if (cleaned.length !== 3 && cleaned.length !== 6) return null;
            const full = cleaned.length === 3 ? cleaned.split('').map(c => c + c).join('') : cleaned;
            const r = parseInt(full.substring(0, 2), 16);
            const g = parseInt(full.substring(2, 4), 16);
            const b = parseInt(full.substring(4, 6), 16);
            return { r, g, b };
        }

        function rgbToHex({ r, g, b }) {
            const toHex = (n) => n.toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        }

        function mixRgb(a, b, t) {
            const clamped = Math.max(0, Math.min(1, t));
            return {
                r: Math.round(a.r + (b.r - a.r) * clamped),
                g: Math.round(a.g + (b.g - a.g) * clamped),
                b: Math.round(a.b + (b.b - a.b) * clamped)
            };
        }

        function approxLuminance({ r, g, b }) {
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function setCssVar(name, value) {
            document.documentElement.style.setProperty(name, value);
        }

        function applyTheme(backgroundHex) {
            const bg = backgroundHex || '#1a1a2e';

            const bgRgb = hexToRgb(bg) || { r: 26, g: 26, b: 46 };
            const isLightBg = approxLuminance(bgRgb) > 0.58;
            const contrastTarget = isLightBg ? { r: 0, g: 0, b: 0 } : { r: 255, g: 255, b: 255 };

            // Accent derived from background (same hue family, higher contrast).
            const accentRgb = mixRgb(bgRgb, contrastTarget, isLightBg ? 0.72 : 0.65);
            const accent = rgbToHex(accentRgb);

            setCssVar('--theme-bg', bg);

            // Surfaces derived from background (slightly pushed towards contrastTarget).
            const surface1Rgb = mixRgb(bgRgb, contrastTarget, 0.14);
            const surface2Rgb = mixRgb(bgRgb, contrastTarget, 0.20);
            setCssVar('--theme-surface', `rgba(${surface1Rgb.r}, ${surface1Rgb.g}, ${surface1Rgb.b}, ${isLightBg ? 0.72 : 0.14})`);
            setCssVar('--theme-surface-2', `rgba(${surface2Rgb.r}, ${surface2Rgb.g}, ${surface2Rgb.b}, ${isLightBg ? 0.58 : 0.09})`);

            if (isLightBg) {
                setCssVar('--theme-text', 'rgba(27, 13, 13, 0.92)');
                setCssVar('--theme-text-strong', '#1b0d0d');
                setCssVar('--theme-muted', 'rgba(27, 13, 13, 0.55)');
            } else {
                setCssVar('--theme-text', 'rgba(255, 255, 255, 0.92)');
                setCssVar('--theme-text-strong', '#ffffff');
                setCssVar('--theme-muted', 'rgba(255, 255, 255, 0.55)');
            }

            setCssVar('--theme-accent', accent);
            setCssVar('--theme-accent-rgb', `${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}`);
            setCssVar('--theme-accent-soft', `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.14)`);
            setCssVar('--theme-border', `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.55)`);
            setCssVar('--theme-border-soft', `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.28)`);

            // Status colors: keep green/red hue, adjust lightness for readability on the chosen background.
            const baseSuccessRgb = { r: 0, g: 255, b: 136 };
            const baseDangerRgb = { r: 255, g: 68, b: 68 };
            const statusMix = isLightBg ? { t: 0.58, target: { r: 0, g: 0, b: 0 } } : { t: 0.16, target: { r: 255, g: 255, b: 255 } };
            const successRgb = mixRgb(baseSuccessRgb, statusMix.target, statusMix.t);
            const dangerRgb = mixRgb(baseDangerRgb, statusMix.target, statusMix.t);
            setCssVar('--theme-success', rgbToHex(successRgb));
            setCssVar('--theme-success-rgb', `${successRgb.r}, ${successRgb.g}, ${successRgb.b}`);
            setCssVar('--theme-danger', rgbToHex(dangerRgb));
            setCssVar('--theme-danger-rgb', `${dangerRgb.r}, ${dangerRgb.g}, ${dangerRgb.b}`);

            document.body.style.background = `linear-gradient(135deg, ${window.currentGradientColor1 || '#224aa8'}, ${window.currentGradientColor2 || '#b56fdc'})`;
        }

        function applyGradient(color1, color2) {
            window.currentGradientColor1 = color1 || '#224aa8';
            window.currentGradientColor2 = color2 || '#b56fdc';
            document.body.style.background = `linear-gradient(135deg, ${window.currentGradientColor1}, ${window.currentGradientColor2})`;
            // Apply theme based on the first gradient color for UI elements
            applyTheme(window.currentGradientColor1);
        }

        gradientColor1Rep.on('change', (newVal) => {
            window.currentGradientColor1 = newVal || '#224aa8';
            applyGradient(window.currentGradientColor1, window.currentGradientColor2);
        });

        gradientColor2Rep.on('change', (newVal) => {
            window.currentGradientColor2 = newVal || '#b56fdc';
            applyGradient(window.currentGradientColor1, window.currentGradientColor2);
        });

        // Phase labels
        const phaseLabels = {
            1: 'Phase 1 - QCM',
            2: 'Phase 2 - 3 Mots',
            3: 'Phase 3 - Résume foireux'
        };

        function hexToRgba(hex, alpha) {
            hex = hex.replace('#', '');
            if (hex.length === 3) {
                hex = hex.split('').map(c => c + c).join('');
            }
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function updateVisibility() {
            const question = questionRep.value;
            const logoUrl = logoUrlRep.value;

            if (!question) return;

            const isHidden = question.state === 'hidden';

            // Always show container to keep scores visible
            questionContainer.classList.add('visible');

            if (isHidden) {
                phaseBadge.classList.add('hidden');
            } else {
                phaseBadge.classList.remove('hidden');
            }

            if (isHidden && logoUrl) {
                questionCard.classList.add('logo-mode');
                questionCard.classList.remove('hidden-content');
                placeholderLogo.src = logoUrl;
            } else if (isHidden && !logoUrl) {
                questionCard.classList.add('hidden-content');
                questionCard.classList.remove('logo-mode');
            } else {
                questionCard.classList.remove('hidden-content');
                questionCard.classList.remove('logo-mode');
            }
        }
        
        questionRep.on('change', (newVal) => {
            if (!newVal) return;

            updateVisibility();
            
            const questionType = newVal.type || 'multipleChoice';
            const phase = newVal.phase || 1;
            const isTrueFalse = questionType === 'trueFalse';
            const isThreeWords = questionType === 'threeWordsClue';
            const isFunnySummary = questionType === 'funnySummary';
            
            const hasPropositions = newVal.propositions && newVal.propositions.length > 0;
           
            phaseBadge.textContent = phaseLabels[phase] || `Phase ${phase}`;
            
            if (hasPropositions) {
                propositionsGrid.style.display = '';
                if (isThreeWords || isFunnySummary) {
                    propositionsGrid.classList.add('special-mode');
                    propositionsGrid.classList.remove('true-false');
                } else {
                    propositionsGrid.classList.remove('special-mode');
                    propositionsGrid.classList.toggle('true-false', isTrueFalse);
                }
            } else {
                propositionsGrid.style.display = 'none';
            }

            cluesContainer.style.display = isThreeWords ? 'flex' : 'none';
            summaryContainer.style.display = isFunnySummary ? 'block' : 'none';
            
            if ((isThreeWords || isFunnySummary) && newVal.state === 'revealed' && !hasPropositions) {
                answerContainer.classList.add('visible');
                questionCard.classList.add('answer-visible');
                answerText.textContent = newVal.answer || 'Réponse';
                wrongFeedbackContainer.classList.remove('visible');
            } else {
                answerContainer.classList.remove('visible');
                questionCard.classList.remove('answer-visible');
            }
            
            if ((isThreeWords || isFunnySummary) && newVal.openWrongTeam && newVal.state === 'showing') {
                const teamKey = newVal.openWrongTeam;
                let teamName = teamKey === 'team1' ? 'Équipe 1' : 'Équipe 2';
                if (scoresRep.value && scoresRep.value[teamKey]) {
                    teamName = scoresRep.value[teamKey].name || teamName;
                }
                wrongFeedbackTeam.textContent = teamName;
                wrongFeedbackContainer.classList.add('visible');
            } else {
                wrongFeedbackContainer.classList.remove('visible');
            }
            
            questionText.textContent = newVal.text || 'Question goes here?';
            
            if (isThreeWords && newVal.clues) {
                newVal.clues.forEach((clue, i) => {
                    if (clueElements[i]) {
                        clueElements[i].textContent = clue;
                    }
                });
            }
            
            if (isFunnySummary && newVal.summary) {
                summaryText.textContent = `"${newVal.summary}"`;
            }
            
            if (hasPropositions) {
                let currentPropCount = 4;
                if (isTrueFalse) {
                    currentPropCount = 2;
                } else if (isThreeWords || isFunnySummary) {
                    currentPropCount = 3;
                }

                if (newVal.propositions) {
                    newVal.propositions.forEach((prop, i) => {
                        if (i < currentPropCount && propElements[i]) {
                            if (propTexts[i]) propTexts[i].textContent = prop || `Answer ${propLetters[i]}`;
                            propElements[i].classList.remove('hidden');
                        }
                    });
                }
                
                for (let i = currentPropCount; i < propElements.length; i++) {
                    if (propElements[i]) propElements[i].classList.add('hidden');
                }
                
                for (let i = 0; i < currentPropCount; i++) {
                    const el = propElements[i];
                    if (!el) continue;
                    
                    const isLastWrong = newVal.lastWrongAnswer == i;
                    const isEliminated = newVal.eliminatedAnswers && newVal.eliminatedAnswers.some(a => a == i);
                    
                    if (isLastWrong && newVal.state === 'showing') {
                        el.classList.remove('correct', 'eliminated');
                        el.classList.add('wrong');
                        
                        if (!newVal.showCorrectOnWrong) {
                            if (wrongAnimationTimeout) clearTimeout(wrongAnimationTimeout);
                            wrongAnimationTimeout = setTimeout(() => {
                                el.classList.remove('wrong');
                                el.classList.add('eliminated');
                            }, 800);
                        }
                    } else {
                        el.classList.remove('correct', 'wrong', 'eliminated');
                        
                        if (newVal.state === 'showing' && isEliminated && !isLastWrong) {
                            el.classList.add('eliminated');
                        }
                        
                        if (newVal.state === 'showing' && newVal.showCorrectOnWrong && i == newVal.correctAnswer) {
                            el.classList.add('correct');
                        }
                        
                        if (newVal.state === 'revealed') {
                            if (i == newVal.correctAnswer) {
                                el.classList.add('correct');
                            }
                            if (isEliminated) {
                                el.classList.add('eliminated');
                            }
                        }
                    }
                }
            }
        });

        logoUrlRep.on('change', updateVisibility);
        
        scoresRep.on('change', (newVal) => {
            if (!newVal) return;
            
            team1Name.textContent = newVal.team1.name || 'Team 1';
            team2Name.textContent = newVal.team2.name || 'Team 2';
            team1Score.textContent = newVal.team1.score || 0;
            team2Score.textContent = newVal.team2.score || 0;
            
            // Apply dynamic team colors
            const team1Color = newVal.team1.color || '#00d9ff';
            const team2Color = newVal.team2.color || '#ff6b6b';
            document.documentElement.style.setProperty('--team1-color', team1Color);
            document.documentElement.style.setProperty('--team2-color', team2Color);
            document.documentElement.style.setProperty('--team1-shadow', hexToRgba(team1Color, 0.5));
            document.documentElement.style.setProperty('--team2-shadow', hexToRgba(team2Color, 0.5));

            const team1Rgb = hexToRgb(team1Color) || { r: 0, g: 217, b: 255 };
            const team2Rgb = hexToRgb(team2Color) || { r: 255, g: 107, b: 107 };
            document.documentElement.style.setProperty('--team1-color-rgb', `${team1Rgb.r}, ${team1Rgb.g}, ${team1Rgb.b}`);
            document.documentElement.style.setProperty('--team2-color-rgb', `${team2Rgb.r}, ${team2Rgb.g}, ${team2Rgb.b}`);
        });
        
        layoutRep.on('change', (newVal) => {
            if (!newVal) return;
            
            if (newVal.question) {
                questionContainer.style.left = `${newVal.question.x}px`;
                questionContainer.style.top = `${newVal.question.y}px`;
            }
        });
    </script>
</body>
</html>
