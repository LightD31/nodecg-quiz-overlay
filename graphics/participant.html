<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Participant View</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* Background Image */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        
        .background-image.hidden {
            display: none;
        }
        
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1400px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        
        /* Question Card */
        .question-container {
            width: 100%;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .question-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .question-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 50px 60px;
            backdrop-filter: blur(20px);
            border: 3px solid rgba(0, 217, 255, 0.4);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.5),
                inset 0 0 60px rgba(0, 217, 255, 0.05);
        }
        
        .question-text {
            font-size: 42px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 50px;
            line-height: 1.4;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        .propositions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        
        .propositions-grid.true-false {
            grid-template-columns: 1fr 1fr;
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* Three Words Clue Layout */
        .clues-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        
        .clue-word {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.25) 0%, rgba(0, 136, 255, 0.15) 100%);
            border: 3px solid #00d9ff;
            border-radius: 25px;
            padding: 35px 55px;
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.5);
            box-shadow: 0 15px 50px rgba(0, 217, 255, 0.35);
        }
        
        .clue-separator {
            font-size: 56px;
            color: #00d9ff;
            font-weight: bold;
        }
        
        /* Funny Summary Layout */
        .summary-container {
            text-align: center;
        }
        
        .summary-text {
            font-size: 42px;
            font-weight: 500;
            color: #fff;
            font-style: italic;
            line-height: 1.5;
            padding: 40px 60px;
            background: linear-gradient(135deg, rgba(255, 165, 2, 0.2) 0%, rgba(255, 107, 107, 0.15) 100%);
            border: 3px solid rgba(255, 165, 2, 0.5);
            border-radius: 25px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.5);
        }
        
        /* Answer Display (for phases 2 & 3) */
        .answer-container {
            text-align: center;
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }
        
        .answer-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .answer-label {
            font-size: 28px;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }
        
        .answer-text {
            font-size: 56px;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
        }
        
        /* Wrong answer feedback for open questions */
        .wrong-feedback-container {
            text-align: center;
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }
        
        .wrong-feedback-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .wrong-feedback {
            display: inline-block;
            background: rgba(255, 68, 68, 0.25);
            border: 3px solid #ff4444;
            border-radius: 20px;
            padding: 20px 50px;
            animation: shake 0.6s ease-in-out;
        }
        
        .wrong-feedback-team {
            font-size: 24px;
            color: #ff6b6b;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .wrong-feedback-text {
            font-size: 32px;
            font-weight: 700;
            color: #ff4444;
        }

        .proposition.hidden {
            display: none;
        }
        
        .proposition {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px 35px;
            display: flex;
            align-items: center;
            gap: 25px;
            transition: all 0.4s ease;
        }
        
        .proposition.correct {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.3) 0%, rgba(0, 255, 136, 0.1) 100%);
            border-color: #00ff88;
            box-shadow: 
                0 0 40px rgba(0, 255, 136, 0.4),
                inset 0 0 30px rgba(0, 255, 136, 0.1);
            transform: scale(1.02);
        }
        
        .proposition.correct .prop-letter {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }
        
        .proposition.wrong {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.35) 0%, rgba(255, 68, 68, 0.15) 100%);
            border-color: #ff4444;
            box-shadow: 
                0 0 40px rgba(255, 68, 68, 0.5),
                inset 0 0 30px rgba(255, 68, 68, 0.15);
            transform: scale(0.98);
        }
        
        .proposition.wrong .prop-letter {
            background: #ff4444;
            color: #fff;
            border-color: #ff4444;
        }
        
        .proposition.eliminated {
            opacity: 0.35;
            background: linear-gradient(135deg, rgba(100, 100, 100, 0.2) 0%, rgba(100, 100, 100, 0.1) 100%);
            border-color: rgba(100, 100, 100, 0.4);
            transform: scale(0.98);
        }
        
        .proposition.eliminated .prop-letter {
            background: rgba(100, 100, 100, 0.5);
            color: #888;
            border-color: #666;
        }
        
        .proposition.eliminated .prop-text {
            color: #888;
            text-decoration: line-through;
        }
        
        .prop-letter {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 217, 255, 0.2);
            border: 3px solid #00d9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: #00d9ff;
            flex-shrink: 0;
            transition: all 0.4s ease;
        }
        
        .prop-text {
            font-size: 28px;
            color: #fff;
            font-weight: 600;
            line-height: 1.3;
        }
        
        /* Waiting State */
        .waiting-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 32px;
            font-weight: 600;
        }
        
        .waiting-message.hidden {
            display: none;
        }
        
        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1.02); }
            50% { transform: scale(1.04); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0) scale(0.98); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) scale(0.98); }
            20%, 40%, 60%, 80% { transform: translateX(8px) scale(0.98); }
        }
        
        .proposition.correct {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .proposition.wrong {
            animation: shake 0.6s ease-in-out;
        }
        
        /* Scoreboard */
        .scoreboard {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 60px;
            padding: 20px 40px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.4) 70%, transparent 100%);
        }
        
        .score-team {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 217, 255, 0.4);
            border-radius: 20px;
            padding: 15px 35px;
            backdrop-filter: blur(10px);
            min-width: 280px;
        }
        
        .score-team-name {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            flex: 1;
        }
        
        .score-team-points {
            font-size: 36px;
            font-weight: 800;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
            min-width: 60px;
            text-align: right;
        }
    </style>
</head>
<body>
    <!-- Background Image -->
    <img id="backgroundImage" class="background-image hidden" src="" alt="">
    
    <div class="container">
        <!-- Waiting Message -->
        <div id="waitingMessage" class="waiting-message">
            Waiting for question...
        </div>
        
        <!-- Question Card -->
        <div class="question-container" id="questionContainer">
            <div class="question-card">
                <div class="question-text" id="questionText">Question goes here?</div>
                
                <!-- Multiple Choice / True-False propositions -->
                <div class="propositions-grid" id="propositionsGrid">
                    <div class="proposition" id="prop0">
                        <span class="prop-letter">A</span>
                        <span class="prop-text" id="propText0">Answer A</span>
                    </div>
                    <div class="proposition" id="prop1">
                        <span class="prop-letter">B</span>
                        <span class="prop-text" id="propText1">Answer B</span>
                    </div>
                    <div class="proposition" id="prop2">
                        <span class="prop-letter">C</span>
                        <span class="prop-text" id="propText2">Answer C</span>
                    </div>
                    <div class="proposition" id="prop3">
                        <span class="prop-letter">D</span>
                        <span class="prop-text" id="propText3">Answer D</span>
                    </div>
                </div>
                
                <!-- Three Words Clue (Phase 2) -->
                <div class="clues-container" id="cluesContainer" style="display: none;">
                    <div class="clue-word" id="clue0">Mot 1</div>
                    <span class="clue-separator">•</span>
                    <div class="clue-word" id="clue1">Mot 2</div>
                    <span class="clue-separator">•</span>
                    <div class="clue-word" id="clue2">Mot 3</div>
                </div>
                
                <!-- Funny Summary (Phase 3) -->
                <div class="summary-container" id="summaryContainer" style="display: none;">
                    <div class="summary-text" id="summaryText">"Un résumé foireux..."</div>
                </div>
                
                <!-- Answer Display (for phases 2 & 3) -->
                <div class="answer-container" id="answerContainer">
                    <div class="answer-label">Réponse</div>
                    <div class="answer-text" id="answerText">Le Film</div>
                </div>
                
                <!-- Wrong Answer Feedback (for phases 2 & 3) -->
                <div class="wrong-feedback-container" id="wrongFeedbackContainer">
                    <div class="wrong-feedback">
                        <div class="wrong-feedback-team" id="wrongFeedbackTeam">Équipe 1</div>
                        <div class="wrong-feedback-text">✗ Mauvaise réponse</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scoreboard -->
    <div class="scoreboard" id="scoreboard">
        <div class="score-team">
            <span class="score-team-name" id="team1Name">Équipe 1</span>
            <span class="score-team-points" id="team1Score">0</span>
        </div>
        <div class="score-team">
            <span class="score-team-name" id="team2Name">Équipe 2</span>
            <span class="score-team-points" id="team2Score">0</span>
        </div>
    </div>

    <script>
        const questionRep = nodecg.Replicant('question');
        const scoresRep = nodecg.Replicant('scores');
        const settingsRep = nodecg.Replicant('displaySettings', {
            defaultValue: { imageUrl: '' }
        });
        
        const questionContainer = document.getElementById('questionContainer');
        const questionText = document.getElementById('questionText');
        const waitingMessage = document.getElementById('waitingMessage');
        const backgroundImage = document.getElementById('backgroundImage');
        const propositionsGrid = document.getElementById('propositionsGrid');
        const cluesContainer = document.getElementById('cluesContainer');
        const summaryContainer = document.getElementById('summaryContainer');
        const answerContainer = document.getElementById('answerContainer');
        const answerText = document.getElementById('answerText');
        const summaryText = document.getElementById('summaryText');
        const wrongFeedbackContainer = document.getElementById('wrongFeedbackContainer');
        const wrongFeedbackTeam = document.getElementById('wrongFeedbackTeam');
        
        const clueElements = [
            document.getElementById('clue0'),
            document.getElementById('clue1'),
            document.getElementById('clue2')
        ];
        
        // Scoreboard elements
        const team1Name = document.getElementById('team1Name');
        const team1Score = document.getElementById('team1Score');
        const team2Name = document.getElementById('team2Name');
        const team2Score = document.getElementById('team2Score');
        
        const propTexts = [
            document.getElementById('propText0'),
            document.getElementById('propText1'),
            document.getElementById('propText2'),
            document.getElementById('propText3')
        ];
        const propElements = [
            document.getElementById('prop0'),
            document.getElementById('prop1'),
            document.getElementById('prop2'),
            document.getElementById('prop3')
        ];
        const propLetters = ['A', 'B', 'C', 'D'];
        
        settingsRep.on('change', (newVal) => {
            if (!newVal) return;
            
            if (newVal.imageUrl) {
                backgroundImage.src = newVal.imageUrl;
                backgroundImage.classList.remove('hidden');
            } else {
                backgroundImage.classList.add('hidden');
            }
        });
        
        scoresRep.on('change', (newVal) => {
            if (!newVal) return;
            
            if (newVal.team1) {
                team1Name.textContent = newVal.team1.name || 'Équipe 1';
                team1Score.textContent = newVal.team1.score || 0;
                const color1 = newVal.team1.color || '#00d9ff';
                team1Score.style.color = color1;
                team1Score.style.textShadow = `0 0 20px ${color1}80`;
                team1Name.parentElement.style.borderColor = `${color1}66`;
            }
            
            if (newVal.team2) {
                team2Name.textContent = newVal.team2.name || 'Équipe 2';
                team2Score.textContent = newVal.team2.score || 0;
                const color2 = newVal.team2.color || '#ff6b6b';
                team2Score.style.color = color2;
                team2Score.style.textShadow = `0 0 20px ${color2}80`;
                team2Name.parentElement.style.borderColor = `${color2}66`;
            }
        });
        
        let wrongAnimationTimeout = null;
        
        questionRep.on('change', (newVal) => {
            if (!newVal) return;
            
            const questionType = newVal.type || 'multipleChoice';
            const isMultipleChoice = questionType === 'multipleChoice' || questionType === 'trueFalse';
            const isThreeWords = questionType === 'threeWordsClue';
            const isFunnySummary = questionType === 'funnySummary';
            const isTrueFalse = questionType === 'trueFalse';
            const propCount = isTrueFalse ? 2 : 4;
            
            // Show/hide appropriate containers based on question type
            propositionsGrid.style.display = isMultipleChoice ? 'grid' : 'none';
            cluesContainer.style.display = isThreeWords ? 'flex' : 'none';
            summaryContainer.style.display = isFunnySummary ? 'block' : 'none';
            
            // Update grid layout for True/False
            if (isTrueFalse) {
                propositionsGrid.classList.add('true-false');
            } else {
                propositionsGrid.classList.remove('true-false');
            }
            
            // Update question text
            questionText.textContent = newVal.text || 'Question goes here?';
            
            // Handle Three Words Clue
            if (isThreeWords && newVal.clues) {
                newVal.clues.forEach((clue, i) => {
                    if (clueElements[i]) {
                        clueElements[i].textContent = clue;
                    }
                });
            }
            
            // Handle Funny Summary
            if (isFunnySummary && newVal.summary) {
                summaryText.textContent = `"${newVal.summary}"`;
            }
            
            // Show answer container only for phases 2 & 3 when revealed
            if ((isThreeWords || isFunnySummary) && newVal.state === 'revealed') {
                answerContainer.classList.add('visible');
                answerText.textContent = newVal.answer || 'Réponse';
                wrongFeedbackContainer.classList.remove('visible');
            } else {
                answerContainer.classList.remove('visible');
            }
            
            // Show wrong feedback for open questions when a team answered wrong (and not revealed)
            if ((isThreeWords || isFunnySummary) && newVal.openWrongTeam && newVal.state === 'showing') {
                const teamKey = newVal.openWrongTeam;
                let teamName = teamKey === 'team1' ? 'Équipe 1' : 'Équipe 2';
                if (scoresRep.value && scoresRep.value[teamKey]) {
                    teamName = scoresRep.value[teamKey].name || teamName;
                }
                wrongFeedbackTeam.textContent = teamName;
                wrongFeedbackContainer.classList.add('visible');
            } else {
                wrongFeedbackContainer.classList.remove('visible');
            }
            
            // Handle Multiple Choice propositions
            if (isMultipleChoice && newVal.propositions) {
                newVal.propositions.forEach((prop, i) => {
                    if (i < propCount) {
                        propTexts[i].textContent = prop || `Answer ${propLetters[i]}`;
                        propElements[i].classList.remove('hidden');
                    }
                });
                
                // Hide unused propositions for True/False questions
                for (let i = propCount; i < 4; i++) {
                    propElements[i].classList.add('hidden');
                }
                
                // Handle correct answer reveal and wrong answer feedback
                for (let i = 0; i < propCount; i++) {
                    const el = propElements[i];
                    const isLastWrong = newVal.lastWrongAnswer === i;
                    const isEliminated = newVal.eliminatedAnswers && newVal.eliminatedAnswers.includes(i);
                    
                    if (isLastWrong && newVal.state === 'showing') {
                        el.classList.remove('correct', 'eliminated');
                        el.classList.add('wrong');
                        
                        if (!newVal.showCorrectOnWrong) {
                            if (wrongAnimationTimeout) clearTimeout(wrongAnimationTimeout);
                            wrongAnimationTimeout = setTimeout(() => {
                                el.classList.remove('wrong');
                                el.classList.add('eliminated');
                            }, 800);
                        }
                    } else {
                        el.classList.remove('correct', 'wrong', 'eliminated');
                        
                        if (newVal.state === 'showing' && isEliminated && !isLastWrong) {
                            el.classList.add('eliminated');
                        }
                        
                        if (newVal.state === 'showing' && newVal.showCorrectOnWrong && i === newVal.correctAnswer) {
                            el.classList.add('correct');
                        }
                        
                        if (newVal.state === 'revealed') {
                            if (i === newVal.correctAnswer) {
                                el.classList.add('correct');
                            }
                            if (isEliminated) {
                                el.classList.add('eliminated');
                            }
                        }
                    }
                }
            }
            
            // Handle visibility
            if (newVal.state === 'hidden' || !newVal.text) {
                questionContainer.classList.remove('visible');
                waitingMessage.classList.remove('hidden');
            } else {
                questionContainer.classList.add('visible');
                waitingMessage.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
