<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Participant View (Global Theme)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        :root {
            --theme-bg: #1a1a2e;
            --theme-surface: rgba(255, 255, 255, 0.08);
            --theme-surface-2: rgba(255, 255, 255, 0.05);
            --theme-text: rgba(255, 255, 255, 0.92);
            --theme-text-strong: #ffffff;
            --theme-muted: rgba(255, 255, 255, 0.55);

            --theme-accent: #7a0000;
            --theme-accent-rgb: 122, 0, 0;
            --theme-accent-soft: rgba(122, 0, 0, 0.14);
            --theme-border: rgba(122, 0, 0, 0.55);
            --theme-border-soft: rgba(122, 0, 0, 0.28);

            --theme-success: #00ff88;
            --theme-success-rgb: 0, 255, 136;
            --theme-danger: #ff4444;
            --theme-danger-rgb: 255, 68, 68;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #224aa8, #b56fdc);
            transition: background 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding-bottom: 230px;
        }
        
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1800px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        
        /* Question Card */
        .question-container {
            width: 100%;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .question-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .question-card {
            background: var(--theme-surface);
            border-radius: 30px;
            padding: 50px 60px;
            backdrop-filter: blur(20px);
            border: 3px solid var(--theme-border);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.35),
                inset 0 0 60px var(--theme-accent-soft);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .question-card.logo-mode {
            padding: 20px;
        }

        .question-card.logo-mode > *:not(#placeholderLogoContainer) {
            display: none !important;
        }

        .question-card.logo-mode #placeholderLogoContainer {
            display: flex;
        }
        
        .question-text {
            font-size: 42px;
            font-weight: 700;
            color: var(--theme-text-strong);
            text-align: center;
            margin-bottom: 50px;
            line-height: 1.4;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            transition: all 0.5s ease;
         }
        
        .propositions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        
        .propositions-grid.true-false {
            grid-template-columns: 1fr 1fr;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .propositions-grid.special-mode {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
            width: 100%;
            grid-template-columns: none;
        }
        
        .propositions-grid.special-mode .proposition {
            flex: 1;
            justify-content: center;
        }

        /* Three Words Clue Layout */
        .clues-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: nowrap;
            transition: all 0.5s ease;
        }
        
        .clue-word {
            background: linear-gradient(135deg, rgba(var(--theme-accent-rgb), 0.25) 0%, rgba(var(--theme-accent-rgb), 0.15) 100%);
            border: 3px solid var(--theme-accent);
            border-radius: 25px;
            padding: 35px 55px;
            font-size: 48px;
            font-weight: 700;
            color: var(--theme-text-strong);
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.35);
            box-shadow: 0 15px 50px rgba(var(--theme-accent-rgb), 0.35);
            white-space: nowrap;
            transition: all 0.5s ease;
        }
        
        .clue-separator {
            font-size: 56px;
            color: var(--theme-accent);
            font-weight: bold;
            transition: all 0.5s ease;
        }
        
        /* Funny Summary Layout */
        .summary-container {
            text-align: center;
            transition: all 0.5s ease;
        }
        
        .summary-text {
            font-size: 42px;
            font-weight: 500;
            color: var(--theme-text-strong);
            font-style: italic;
            line-height: 1.5;
            padding: 40px 60px;
            background: linear-gradient(135deg, rgba(var(--theme-accent-rgb), 0.20) 0%, rgba(var(--theme-accent-rgb), 0.12) 100%);
            border: 3px solid var(--theme-border-soft);
            border-radius: 25px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.35);
            transition: all 0.5s ease;
        }
        
        /* Answer Display (for phases 2 & 3) */
        .answer-container {
            text-align: center;
            margin-top: 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            max-height: 0;
            overflow: hidden;
        }
        
        .answer-container.visible {
            margin-top: 30px;
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
        }
        
        .answer-label {
            font-size: 28px;
            color: var(--theme-success);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            transition: all 0.5s ease;
        }
        
        .answer-text {
            font-size: 56px;
            font-weight: 700;
            color: var(--theme-success);
            text-shadow: 0 0 40px rgba(var(--theme-success-rgb), 0.45);
            transition: all 0.5s ease;
        }
        
        /* Wrong answer feedback for open questions */
        .wrong-feedback-container {
            text-align: center;
            margin-top: 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            max-height: 0;
            overflow: hidden;
        }
        
        .wrong-feedback-container.visible {
            margin-top: 30px;
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
        }
        
        .wrong-feedback {
            display: inline-block;
            background: rgba(var(--theme-danger-rgb), 0.22);
            border: 3px solid var(--theme-danger);
            border-radius: 20px;
            padding: 20px 50px;
            animation: shake 0.6s ease-in-out;
        }
        
        .wrong-feedback-team {
            font-size: 24px;
            color: var(--theme-danger);
            font-weight: 600;
            margin-bottom: 8px;
            transition: all 0.5s ease;
        }
        
        .wrong-feedback-text {
            font-size: 32px;
            font-weight: 700;
            color: var(--theme-danger);
            transition: all 0.5s ease;
        }

        .proposition.hidden {
            display: none;
        }
        
        .proposition {
            background: var(--theme-surface-2);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-color: var(--theme-border-soft);
            border-radius: 20px;
            padding: 30px 35px;
            display: flex;
            align-items: center;
            gap: 25px;
            transition: all 0.4s ease;
        }
        
        .proposition.correct {
            background: linear-gradient(135deg, rgba(var(--theme-success-rgb), 0.30) 0%, rgba(var(--theme-success-rgb), 0.10) 100%);
            border-color: var(--theme-success);
            box-shadow: 
                0 0 40px rgba(var(--theme-success-rgb), 0.32),
                inset 0 0 30px rgba(var(--theme-success-rgb), 0.10);
            transform: scale(1.02);
        }
        
        .proposition.correct .prop-letter {
            background: var(--theme-success);
            color: #000;
            border-color: var(--theme-success);
        }
        
        .proposition.wrong {
            background: linear-gradient(135deg, rgba(var(--theme-danger-rgb), 0.30) 0%, rgba(var(--theme-danger-rgb), 0.12) 100%);
            border-color: var(--theme-danger);
            box-shadow: 
                0 0 40px rgba(var(--theme-danger-rgb), 0.34),
                inset 0 0 30px rgba(var(--theme-danger-rgb), 0.12);
            transform: scale(0.98);
        }
        
        .proposition.wrong .prop-letter {
            background: var(--theme-danger);
            color: #fff;
            border-color: var(--theme-danger);
        }
        
        .proposition.eliminated {
            opacity: 0.35;
            background: linear-gradient(135deg, rgba(100, 100, 100, 0.2) 0%, rgba(100, 100, 100, 0.1) 100%);
            border-color: rgba(100, 100, 100, 0.4);
            transform: scale(0.98);
        }
        
        .proposition.eliminated .prop-letter {
            background: rgba(100, 100, 100, 0.5);
            color: var(--theme-muted);
            border-color: #666;
        }
        
        .proposition.eliminated .prop-text {
            color: var(--theme-muted);
            text-decoration: line-through;
        }
        
        .prop-letter {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(var(--theme-accent-rgb), 0.20);
            border: 3px solid var(--theme-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: var(--theme-accent);
            flex-shrink: 0;
            transition: all 0.4s ease;
        }
        
        .prop-text {
            font-size: 28px;
            color: var(--theme-text);
            font-weight: 600;
            line-height: 1.3;
        }
        
        /* Waiting State */
        .waiting-message {
            text-align: center;
            color: var(--theme-muted);
            font-size: 32px;
            font-weight: 600;
        }
        
        .waiting-message.hidden {
            display: none;
        }

        #placeholderLogoContainer {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #placeholderLogo {
            max-width: 80%;
            max-height: 350px;
            object-fit: contain;
        }
        
        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1.02); }
            50% { transform: scale(1.04); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0) scale(0.98); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) scale(0.98); }
            20%, 40%, 60%, 80% { transform: translateX(8px) scale(0.98); }
        }
        
        .proposition.correct {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .proposition.wrong {
            animation: shake 0.6s ease-in-out;
        }
        
        /* Scoreboard */
        .scoreboard {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 100px;
            padding: 40px 60px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.6) 60%, transparent 100%);
        }
        
        .score-pill {
            background: var(--theme-surface);
            backdrop-filter: blur(15px);
            padding: 25px 80px;
            border-radius: 80px;
            display: flex;
            align-items: center;
            gap: 50px;
            height: 150px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            border: 3px solid var(--theme-border-soft);
            min-width: 500px;
            overflow: hidden;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        }

        .score-pill::before {
            display: none;
        }

        .score-pill.team-1 {
            --pill-accent-rgb: var(--team1-color-rgb, 0, 217, 255);
            --pill-accent-shadow: var(--team1-shadow, rgba(0, 217, 255, 0.5));
            background: rgba(var(--team1-color-rgb, 0, 217, 255), 0.80);
            border-color: rgba(var(--team1-color-rgb, 0, 217, 255), 0.95);
            box-shadow:
                0 18px 60px rgba(0, 0, 0, 0.35),
                0 12px 45px var(--team1-shadow, rgba(0, 217, 255, 0.5));
        }

        .score-pill.team-2 {
            --pill-accent-rgb: var(--team2-color-rgb, 255, 107, 107);
            --pill-accent-shadow: var(--team2-shadow, rgba(255, 107, 107, 0.5));
            background: rgba(var(--team2-color-rgb, 255, 107, 107), 0.80);
            border-color: rgba(var(--team2-color-rgb, 255, 107, 107), 0.95);
            box-shadow:
                0 18px 60px rgba(0, 0, 0, 0.35),
                0 12px 45px var(--team2-shadow, rgba(255, 107, 107, 0.5));
        }

        .score-pill .team-name {
            font-size: 56px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.96);
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 2px 6px rgba(0,0,0,0.35);
            transition: all 0.3s ease;
        }
        
        .score-pill .team-points {
            font-size: 96px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.98);
            text-shadow:
                0 2px 8px rgba(0,0,0,0.40),
                0 0 26px rgba(var(--pill-accent-rgb, 255, 255, 255), 0.22);
            min-width: 120px;
            text-align: center;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Waiting Message -->
        <div id="waitingMessage" class="waiting-message">
            Waiting for question...
        </div>
        
        <!-- Question Card -->
        <div class="question-container" id="questionContainer">
            <div class="question-card" id="questionCard">
                <!-- Placeholder Logo -->
                <div id="placeholderLogoContainer">
                    <img id="placeholderLogo" src="">
                </div>

                <div class="question-text" id="questionText">Question goes here?</div>
                
                <!-- Three Words Clue (Phase 2) -->
                <div class="clues-container" id="cluesContainer" style="display: none;">
                    <div class="clue-word" id="clue0">Mot 1</div>
                    <span class="clue-separator">•</span>
                    <div class="clue-word" id="clue1">Mot 2</div>
                    <span class="clue-separator">•</span>
                    <div class="clue-word" id="clue2">Mot 3</div>
                </div>
                
                <!-- Funny Summary (Phase 3) -->
                <div class="summary-container" id="summaryContainer" style="display: none;">
                    <div class="summary-text" id="summaryText">"Un résumé foireux..."</div>
                </div>
                
                <!-- Propositions Grid (Used for all types) -->
                <div class="propositions-grid" id="propositionsGrid">
                    <div class="proposition" id="prop0">
                        <span class="prop-letter">A</span>
                        <span class="prop-text" id="propText0">Answer A</span>
                    </div>
                    <div class="proposition" id="prop1">
                        <span class="prop-letter">B</span>
                        <span class="prop-text" id="propText1">Answer B</span>
                    </div>
                    <div class="proposition" id="prop2">
                        <span class="prop-letter">C</span>
                        <span class="prop-text" id="propText2">Answer C</span>
                    </div>
                    <div class="proposition" id="prop3">
                        <span class="prop-letter">D</span>
                        <span class="prop-text" id="propText3">Answer D</span>
                    </div>
                </div>
                
                <!-- Answer Display (for phases 2 & 3) -->
                <div class="answer-container" id="answerContainer">
                    <div class="answer-label">Réponse</div>
                    <div class="answer-text" id="answerText">Le Film</div>
                </div>
                
                <!-- Wrong Answer Feedback (for phases 2 & 3) -->
                <div class="wrong-feedback-container" id="wrongFeedbackContainer">
                    <div class="wrong-feedback">
                        <div class="wrong-feedback-team" id="wrongFeedbackTeam">Équipe 1</div>
                        <div class="wrong-feedback-text">✗ Mauvaise réponse</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scoreboard -->
    <div class="scoreboard" id="scoreboard">
        <div class="score-pill team-1">
            <span class="team-name" id="team1Name">Équipe 1</span>
            <span class="team-points" id="team1Score">0</span>
        </div>
        <div class="score-pill team-2">
            <span class="team-points" id="team2Score">0</span>
            <span class="team-name" id="team2Name">Équipe 2</span>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/question-view.js"></script>
    <script>
        const questionRep = nodecg.Replicant('question');
        const scoresRep = nodecg.Replicant('scores');
        const logoUrlRep = nodecg.Replicant('logoUrl');
        const gradientColor1Rep = nodecg.Replicant('gradientColor1', { defaultValue: '#224aa8' });
        const gradientColor2Rep = nodecg.Replicant('gradientColor2', { defaultValue: '#b56fdc' });

        // Shared with overlay-integrated.html - see graphics/js/.
        const { applyGradient, hexToRgb, hexToRgba } = QuizTheme;
        const {
            isThreeWords,
            isFunnySummary,
            hasPropositions,
            applyGridMode,
            renderCluesAndSummary,
            renderPropositions,
            renderWrongFeedback
        } = QuizQuestionView;

        const questionContainer = document.getElementById('questionContainer');
        const questionCard = document.getElementById('questionCard');
        const questionText = document.getElementById('questionText');
        const waitingMessage = document.getElementById('waitingMessage');
        const propositionsGrid = document.getElementById('propositionsGrid');
        const cluesContainer = document.getElementById('cluesContainer');
        const summaryContainer = document.getElementById('summaryContainer');
        const answerContainer = document.getElementById('answerContainer');
        const answerText = document.getElementById('answerText');
        const summaryText = document.getElementById('summaryText');
        const wrongFeedbackContainer = document.getElementById('wrongFeedbackContainer');
        const wrongFeedbackTeam = document.getElementById('wrongFeedbackTeam');
        const placeholderLogo = document.getElementById('placeholderLogo');

        const clueElements = [
            document.getElementById('clue0'),
            document.getElementById('clue1'),
            document.getElementById('clue2')
        ];
        
        // Scoreboard elements
        const team1Name = document.getElementById('team1Name');
        const team1Score = document.getElementById('team1Score');
        const team2Name = document.getElementById('team2Name');
        const team2Score = document.getElementById('team2Score');
        
        const propTexts = [
            document.getElementById('propText0'),
            document.getElementById('propText1'),
            document.getElementById('propText2'),
            document.getElementById('propText3')
        ];
        const propElements = [
            document.getElementById('prop0'),
            document.getElementById('prop1'),
            document.getElementById('prop2'),
            document.getElementById('prop3')
        ];

        gradientColor1Rep.on('change', (newVal) => {
            window.currentGradientColor1 = newVal || '#224aa8';
            applyGradient(window.currentGradientColor1, window.currentGradientColor2);
        });

        gradientColor2Rep.on('change', (newVal) => {
            window.currentGradientColor2 = newVal || '#b56fdc';
            applyGradient(window.currentGradientColor1, window.currentGradientColor2);
        });

        function updateVisibility() {
            const question = questionRep.value;
            const logoUrl = logoUrlRep.value;

            if (!question) return;

            const isHidden = question.state === 'hidden' || !question.text;

            if (isHidden && logoUrl) {
                placeholderLogo.src = logoUrl;
                questionCard.classList.add('logo-mode');
                questionContainer.classList.add('visible');
                waitingMessage.classList.add('hidden');
            } else if (isHidden && !logoUrl) {
                questionContainer.classList.remove('visible');
                waitingMessage.classList.remove('hidden');
                questionCard.classList.remove('logo-mode');
            } else {
                questionContainer.classList.add('visible');
                waitingMessage.classList.add('hidden');
                questionCard.classList.remove('logo-mode');
            }
        }
        
        scoresRep.on('change', (newVal) => {
            if (!newVal) return;
            
            if (newVal.team1) {
                team1Name.textContent = newVal.team1.name || 'Équipe 1';
                team1Score.textContent = newVal.team1.score || 0;
            }
            
            if (newVal.team2) {
                team2Name.textContent = newVal.team2.name || 'Équipe 2';
                team2Score.textContent = newVal.team2.score || 0;
            }

            const team1Color = newVal.team1?.color || '#00d9ff';
            const team2Color = newVal.team2?.color || '#ff6b6b';
            document.documentElement.style.setProperty('--team1-color', team1Color);
            document.documentElement.style.setProperty('--team2-color', team2Color);
            document.documentElement.style.setProperty('--team1-shadow', hexToRgba(team1Color, 0.3));
            document.documentElement.style.setProperty('--team2-shadow', hexToRgba(team2Color, 0.3));

            const team1Rgb = hexToRgb(team1Color) || { r: 0, g: 217, b: 255 };
            const team2Rgb = hexToRgb(team2Color) || { r: 255, g: 107, b: 107 };
            document.documentElement.style.setProperty('--team1-color-rgb', `${team1Rgb.r}, ${team1Rgb.g}, ${team1Rgb.b}`);
            document.documentElement.style.setProperty('--team2-color-rgb', `${team2Rgb.r}, ${team2Rgb.g}, ${team2Rgb.b}`);
        });
        
        questionRep.on('change', (newVal) => {
            if (!newVal) return;

            updateVisibility();

            applyGridMode(newVal, propositionsGrid);
            renderCluesAndSummary(newVal, cluesContainer, clueElements, summaryContainer, summaryText);

            questionText.textContent = newVal.text || 'Question goes here?';

            // The participant view only shows the answer once there is one to
            // show; the stream overlay falls back to a placeholder.
            const isOpenAnswer = (isThreeWords(newVal) || isFunnySummary(newVal)) && !hasPropositions(newVal);
            if (isOpenAnswer && newVal.state === 'revealed' && newVal.answer) {
                answerContainer.classList.add('visible');
                answerText.textContent = newVal.answer;
            } else {
                answerContainer.classList.remove('visible');
            }

            renderWrongFeedback(newVal, scoresRep.value, wrongFeedbackContainer, wrongFeedbackTeam);

            renderPropositions(newVal, propElements, propTexts);
        });

        logoUrlRep.on('change', updateVisibility);
    
    </script>
</body>
</html>
